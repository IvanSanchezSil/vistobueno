[project]
name = "vistobueno"
version = "0.1.0"
description = "Validador automático de formato de tesis — UNT FECyC"
requires-python = ">=3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=validator --cov-report=term-missing"

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = [".venv", "frontend", "recursos"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Query", "fastapi.Path"]

[tool.mypy]
python_version = "3.14"
files = ["validator", "scripts"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true