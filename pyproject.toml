[project]
name = "vistobueno"
version = "0.1.0"
description = "Validador automático de formato de tesis — UNT FECyC"
requires-python = ">=3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Piso de cobertura (hallazgo C6): se mide sobre la suite completa del
# entorno de CI (sin recursos/): 93% real, 90% de piso para dar margen
# ante deriva. Solo aplica cuando coverage corre: nix flake check y CI.
# El pytest local queda libre del flag --cov (hallazgo C1).
fail_under = 90

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = [".venv", "frontend", "recursos"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Query", "fastapi.Path"]

[tool.mypy]
python_version = "3.14"
files = ["validator", "scripts"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
