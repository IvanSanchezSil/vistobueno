# ============================================================
# AMBIGÜEDADES — requieren resolución humana
# ============================================================
ambiguedades:

  - id: amb_margen_derecho_archivo_vs_regla
    descripcion: >
      El manual PRESCRIPE margen derecho = 2.5 cm, pero el propio archivo
      DOCX del manual tiene margen derecho configurado en 3.0 cm.
      Las 5 plantillas sí usan 2.5 cm (correcto según la regla).
      El archivo del manual parece tener un error de configuración.
    documentos:
      - "MANUAL (DOCX): right_margin = 3.00 cm (configuración real del archivo)"
      - "MANUAL (texto): 'Derecho: 2.5 cm' (lo que prescribe)"
      - "Todas las plantillas: right_margin = 2.50 cm"
    accion_recomendada: "Usar 2.5 cm como regla (lo que el texto dice). El DOCX del manual tiene error."

  - id: amb_interlineado_unidades
    descripcion: >
      El manual dice 'Interlineado: 1.5 puntos' — técnicamente, 1.5 puntos
      tipográficos es ~0.5 mm (casi ilegible). Lo que se quiere decir es
      '1.5 líneas' (line spacing 1.5). Las plantillas confirman que usan
      ONE_POINT_FIVE (1.5 líneas). Pero la redacción es ambigua.
    documentos:
      - "MANUAL (texto): 'Interlineado: 1.5 puntos'"
      - "Plantillas: line_spacing_rule = ONE_POINT_FIVE"
    accion_recomendada: "Interpretar como 1.5 líneas (ONE_POINT_FIVE). Corregir la redacción del manual."

  - id: amb_tamano_papel_unidades
    descripcion: >
      El manual dice 'Tamaño A4/papel (210x297 cm)'. 210x297 cm es un papel
      gigante (~2x3 metros). Lo correcto es 210x297 mm. Error tipográfico.
    documentos:
      - "MANUAL (texto): 'Tamaño A4/papel (210x297 cm)'"
    accion_recomendada: "Corregir a 210x297 mm. A4 es universalmente 210x297 mm."

  - id: amb_referencias_minimo_variable_segun_tipo
    descripcion: >
      Hay dos mínimos de referencias distintos según el tipo de investigación:
      Cuantitativo = mínimo 20; Cualitativo = mínimo 30; Revisión = mínimo 20.
      El validador necesita saber qué tipo de investigación es el trabajo
      para aplicar la regla correcta.
    documentos:
      - "MANUAL (párr. 271): 'mínimo de 20 referencias' (cuantitativo)"
      - "MANUAL (párr. 376): 'mínimo de 30 referencias' (cualitativo)"
      - "MANUAL (párr. 532): 'mínimo de 20 referencias' (revisión)"
    accion_recomendada: "El validador debe preguntar el tipo de investigación, o validar con tolerancia de 20 como mínimo global."

  - id: amb_resumen_extension_maxima
    descripcion: >
      El manual dice 'extensión mínima 159' pero el texto se trunca y no
      se ve la extensión máxima. Necesita completarse.
    documentos:
      - "MANUAL (párr. 201): 'Su extensión mínima 159 y su extensión máxima...'"
    accion_recomendada: "Verificar el valor de extensión máxima en el manual original."

  - id: amb_sangria_plantillas_708_vs_720
    descripcion: >
      El manual prescribe sangría de primera línea de 1.27 cm (720 twips).
      EVALUADO: las 5 plantillas SI aplican <w:ind w:firstLine="708"/> en
      párrafos de cuerpo y 709 en portada (~1.25 cm) — desvío menor pero
      verificable contra el valor prescrito (720).
    documentos:
      - "MANUAL (párr. 141): sangría de 1.27 cm (720 twips)"
      - "Plantillas: w:firstLine=708 (cuerpo) / 709 (portada)"
    accion_recomendada: "El check exige 720; las plantillas incumplen en 12 twips (~0.02 cm). DECISIÓN (2026-09-01): severidad bajada a warning hasta que la universidad confirme si 720 (manual) o 708/709 (plantillas) es el valor correcto. No bloquea la entrega mientras tanto."

  - id: amb_rcu274_contenido
    descripcion: >
      El RCU-N-274-2022-UNT (Reglamento N° 007-2022-UNT/URA, Reglamento General
      de Otorgamiento de Grados Académicos y Títulos Profesionales) ya fue
      leído vía OCR (recursos/ocr/RCU-N-274-2022-UNT.txt, 2026-09-02).
      Es un reglamento de PROCEDIMIENTOS de graduación/titulación (requisitos
      administrativos, jurados, trámites), no de formato DOCX.
      Aporta el Anexo 5: esquema de PROYECTO/INFORME de investigación y de
      ARTÍCULO CIENTÍFICO, que complementa las reglas de estructura del manual
      pero no coincide 1:1 con las plantillas oficiales (que son de Trabajo de
      Investigación de tipo cuantitativo). Por eso su estructura no se mecaniza;
      se registra en no_deterministas.
    documentos:
      - "RCU-N-274-2022-UNT.pdf -> recursos/ocr/RCU-N-274-2022-UNT.txt (25 páginas, OCR 2026-09-02)"
    accion_recomendada: "Tratar el Anexo 5 como referencia de proyecto/artículo (no determinista). No agregar reglas de estructura DOCX automáticas a partir de él."

  - id: amb_rcu220_lineas_investigacion_codigo
    descripcion: >
      El RCU-N-220-2022 (Líneas de Investigación) ya fue leído vía OCR
      (recursos/ocr/RCU-N-220-2022-UNT-LINEAS DE INVESTIGACION.txt, 2026-09-02).
      La hipótesis previa de estructura "código - nombre" quedó DESCARTADA:
      las líneas se listan como NÚMERO correlativo + NOMBRE (sin código
      alfanumérico). La lista se representó como lista de valores válidos en la
      regla caratula_linea_investigacion (todas las categorías: consolidadas,
      por consolidar y emergentes; comparación insensible a mayúsculas porque
      la plantilla escribe "Desarrollo Sostenible" y el RCU "desarrollo sostenible").
    documentos:
      - "RCU-N-220-2022-UNT-LINEAS DE INVESTIGACION.pdf -> recursos/ocr/RCU-N-220-2022-UNT-LINEAS DE INVESTIGACION.txt (5 páginas, OCR 2026-09-02)"
      - "Plantilla FECyC: 'Educación y Ciencias de la Comunicación y Desarrollo Sostenible'"
    accion_recomendada: "RESUELTO (2026-09-02): la lista oficial se usa en la regla caratula_linea_investigacion. Sin códigos."


# ============================================================
# REQUISITOS NO DETERMINISTAS — no entran al YAML
# Solo para referencia futura
# ============================================================
no_deterministas:

  - "El resumen debe proporcionar al lector una impresión general del trabajo."
  - "La redacción de la situación problemática debe ser en prosa, en tiempo pasado, y carecer de subtítulos."
  - "El abstract debe ser traducido por un especialista en idioma inglés."
  - "Las bases teóricas deben integrar teorías, conceptos, antecedentes y enfoques teóricos vinculados con el problema."
  - "Los antecedentes se redactan de manera narrativa: autor, año, objetivo, resultados y se concluye."
  - "Las conclusiones deben representar proposiciones finales derivadas directamente de los resultados."
  - "El estudio debe emplear una metodología de investigación adecuada al problema planteado."
  - "La justificación debe incluir la importancia teórica, práctica, metodológica y social."
  - "Las hipótesis deben ser proposiciones tentativas susceptibles de verificación empírica."
  - "La dedicatoria es de forma libre, dirigida a personas significativas."
  - "El agradecimiento manifiesta estima y gratitud a quienes brindaron apoyo."
  - "La presentación permite exhibir el contenido del trabajo ante la comunidad académica."
  - "El problema debe formularse como interrogante y contener las variables principales."
  - "La línea de investigación debe vincularse con el área de educación y la escuela profesional."
  - "Los objetivos generales se enuncian con verbo en infinitivo."
  - "El título debe identificar el campo de investigación, el objeto de estudio, los términos temáticos y la(s) variable(s) principal(es)."
  - "Los participantes de la investigación cualitativa deben proporcionar información rica, profunda y significativa."
  - "El diseño cualitativo debe ser un plan flexible y emergente."
  - "El Trabajo de Suficiencia Profesional debe demostrar competencias para el ejercicio profesional."

  # ─── Del RCU-N-274-2022/UNT (Reglamento General de Grados y Títulos, Anexo 5) ──
  # Esquema (básico) de DISEÑO DE PROYECTO DE INVESTIGACIÓN (enfoque cuantitativo):
  - "El proyecto debe incluir datos de identificación: título, área y línea de investigación, localización y tipo de proyecto (investigación básica, aplicada o desarrollo experimental)."
  - "El proyecto cuantitativo incluye: planteamiento del problema, situación problemática, formulación del problema, justificación, objetivos (general y específicos)."
  - "El proyecto cuantitativo incluye marco teórico: antecedentes del problema y bases teóricas o marco conceptual."
  - "El proyecto cuantitativo incluye hipótesis y variables: formulación de hipótesis, y variables con definición conceptual y operacional."
  - "El proyecto cuantitativo incluye metodología: diseño metodológico, diseño muestral, técnicas de recolección de datos, técnicas estadísticas de procesamiento, y aspectos éticos y regulatorios."
  - "El proyecto cuantitativo incluye aspectos administrativos: cronograma, presupuesto y fuentes de financiamiento, más resultados esperados, referencias bibliográficas y anexos."
  # Esquema (básico) de DISEÑO DE PROYECTO DE INVESTIGACIÓN (enfoque cualitativo):
  - "El proyecto cualitativo incluye planteamiento del problema (situación problemática, formulación, justificación, objetivos y limitaciones), revisión de la literatura (antecedentes y marco teórico), metodología (diseño metodológico, procedimiento de muestreo, recolección y análisis de la información, aspectos éticos y regulatorios), aspectos administrativos, resultados esperados, referencias bibliográficas y anexos."
  # Esquema de INFORME DE INVESTIGACIÓN / TESIS (art. 2° Ley Repositorio N°30025, RCD 033-2016-SUNEDU, RR 384-2018/UNT):
  - "El informe/tesis debe contener componentes fundamentales: contextualización, problematización, planteamiento de hipótesis, demostración/explicación/validación mediante análisis y discusión de hechos, y arribo a conclusiones y recomendaciones con respaldo bibliográfico."
  # Esquema de ARTÍCULO CIENTÍFICO (sugerido; las partes resaltadas en negrita son imprescindibles):
  - "El artículo científico exige: título claro y conciso sin símbolos ni abreviaturas; autor(es) con código ORCID; filiación; resumen y palabras clave; abstract y key words; introducción (1.5-2 páginas, doble espacio, 12pt); metodología (2-4 páginas); resultados y discusión (10-12 páginas); conclusiones (1-2 páginas); referencias bibliográficas (20-50); declaración de conflicto de interés; reconocimientos y agradecimientos; y correo electrónico del autor principal."


