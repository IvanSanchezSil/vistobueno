    mecanismo_verificable:
      nota: 'Run del nombre de la universidad en portada: <w:sz w:val="36"/> (18pt).'
      checks:
      - tipo: xml_atributo
        parte: document
        contexto: todos
        xpath: //w:body/w:p[contains(translate(normalize-space(.), 'ABCDEFGHIJKLMNOPQRSTUVWXYZÁÉÍÓÚÑÜ', 'abcdefghijklmnopqrstuvwxyzáéíóúñü'), 'universidad')][1]/w:r[1]/w:rPr/w:sz
