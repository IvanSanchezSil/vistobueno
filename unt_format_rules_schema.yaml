# ============================================================
# ESQUEMA DE REGLAS DE FORMATO — UNT FECyC
# Fuente primaria: MANUAL REVISADO TERCERA VERSION (11-07-2025)
# Generado: 2026-09-01
#
# CONVENCIÓN DE NIVEL DE VERIFICACIÓN:
# - Las reglas con campo "mecanismo_verificable" se comprueban
#   directamente sobre la estructura del archivo .docx (XML),
#   sin renderizar ni interpretar texto.
# - Las reglas SIN ese campo requieren análisis de contenido
#   semántico (contar palabras, leer citas, contar referencias);
#   no son verificables por estructura de archivo.
# - Los valores XML heredan la evidencia de las 5 plantillas y
#   del manual; cuando el mecanismo contradice al manual se
#   registra en la sección ambiguedades.
# - Las notas con prefijo "EVALUADO:" documentan el resultado de
#   ejecutar el check contra las 5 plantillas (2026-09-01).
#
# MECANISMO_VERIFICABLE (estructura ejecutable):
#   cada value es un mapping con:
#     nota:  texto humano que describe el mecanismo
#     checks: lista de comprobaciones, cada una con:
#       tipo: xml_atributo | xml_presencia | texto_regex | texto_en_lista
#             | secuencia_titulos | imagen_presencia
#       parte: document | footer | header   (defecto: document)
#       archivo: parte alternativa del paquete OPC, ej. word/footer1.xml (opcional)
#       contexto: todos | cuerpo            (defecto: todos)
#         "cuerpo" = párrafos de la ULTIMA sección: los que están después
#         del último <w:sectPr> anidado en <w:pPr> (límite real de sección),
#         con estilo Normal/sin estilo. El evaluador lo resuelve en código.
#       xpath: expresión XPath usando los prefijos de "namespaces"
#       atributo: selector de atributo, ej. @w:val (solo xml_atributo)
#       comparacion:
#         eq | all_eq     -> igualdad (atributo o contenido)
#         exists | not_exists -> presencia/ausencia de nodos
#         contains        -> subcadena (usa ignore_case si se indica)
#         regex           -> para texto_regex
#       esperado: valor contra el que comparar (salvo exists/not_exists)
#       patron: expresión regular (solo texto_regex); TODOS los nodos W:t
#               que matchean xpath deben cumplirla
#       lista: lista de valores permitidos (solo texto_en_lista): el texto
#              concatenado de los nodos que matchean xpath debe pertenecer
#              a la lista; ignore_case (opcional, defecto false) hace la
#              comparación insensible a mayúsculas.
#       ignore_case: true|false (opcional, para contains)
#       fuente_lista: valor_esperado (solo secuencia_titulos: compara los
#                     títulos que matchean contra la lista valor_esperado
#                     de la propia regla)
#       normalizacion: [opcional|mayusculas|ignorar_indent] (solo secuencia_titulos)
#       formato: png (solo imagen_presencia)
#       cantidad_minima: N (solo imagen_presencia)
#   parte footer/header: se resuelve contra el componente por defecto de la
#   primera sección (word/footer1.xml, word/header1.xml).
#
# CONVENCIONES XPath (verificadas con lxml/libxml2):
# - Predicados de posición (position()/last()) SIEMPRE sobre nodo-set
#   parentizado: (//w:sectPr)[position() = last()] — sin paréntesis, libxml2
#   evalúa el predicado como conjunto singleton y el resultado es incorrecto.
# - Anclajes por texto (contains/starts-with en portada) usan translate()
#   para búsqueda case-insensitive.
# - secuencia_titulos: los estilos de encabezado se reconocen por "Ttulo1..3"
#   (español) o "Heading1..3"; el ítem de portada ("Carátula") se satisface
#   con el primer párrafo que contiene "Universidad" (la portada no usa
#   estilo de encabezado).
# ============================================================

namespaces:
  w: "http://schemas.openxmlformats.org/wordprocessingml/2006/main"
  r: "http://schemas.openxmlformats.org/officeDocument/2006/relationships"
  a: "http://schemas.openxmlformats.org/drawingml/2006/main"
  pic: "http://schemas.openxmlformats.org/drawingml/2006/picture"

rules:

  # ─── PAPEL ───────────────────────────────────────────────
  - id: papel_tamano
    tipo: papel
    descripcion: El tamaño del papel debe ser A4
    valor_esperado: "210 x 297 mm"
    severidad: error
    fuente: "MANUAL REVISADO TERCERA VERSION OBSERVACIONES 11-07-2025.docx"
    ubicacion: 'Sección "Formato general" (párr. 124-125 para Trabajo de Investigación Cuantitativo; se repite idéntico en párr. 443-444, 593-594 para otros tipos)'
    cita: '"Tamaño A4/papel (210x297 cm)"'
    mecanismo_verificable:
      nota: '<w:pgSz w:w="11906" w:h="16838"/> (A4: 21.0 x 29.7 cm en twips). Confirmado en las 5 plantillas.'
      checks:
      - tipo: xml_atributo
        parte: document
        contexto: todos
        xpath: //w:sectPr[1]/w:pgSz
        atributo: '@w:w'
        comparacion: eq
        esperado: '11906'
      - tipo: xml_atributo
        parte: document
        contexto: todos
        xpath: //w:sectPr[1]/w:pgSz
        atributo: '@w:h'
        comparacion: eq
        esperado: '16838'
  # ─── FUENTE Y TAMAÑO ────────────────────────────────────
  - id: fuente_principal
    tipo: fuente
    descripcion: La fuente del cuerpo del texto debe ser Times New Roman
    valor_esperado: "Times New Roman"
    severidad: error
    fuente: "MANUAL REVISADO TERCERA VERSION OBSERVACIONES 11-07-2025.docx"
    ubicacion: 'Sección "Formato general" (párr. 126-127)'
    cita: '"Times New Roman: 12 puntos"'
    mecanismo_verificable:
      nota: 'Runs de parrafos: <w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman"/> en rPr. Confirmado en el cuerpo del manual y en las portadas de las plantillas.'
      checks:
      - tipo: xml_atributo
        parte: document
        contexto: cuerpo
        xpath: //w:body//w:p[w:r]/w:r[1]/w:rPr/w:rFonts
        atributo: '@w:ascii'
        comparacion: all_eq
        esperado: Times New Roman
  - id: tamano_cuerpo
    tipo: fuente
    descripcion: El tamaño de letra del cuerpo del texto debe ser 12 puntos
    valor_esperado: "12pt"
    severidad: error
    fuente: "MANUAL REVISADO TERCERA VERSION OBSERVACIONES 11-07-2025.docx"
    ubicacion: 'Sección "Formato general" (párr. 126-127)'
    cita: '"Times New Roman: 12 puntos"'
    mecanismo_verificable:
      nota: 'Runs: <w:sz w:val="24"/> (12pt = 24 half-points). Confirmado en el cuerpo del manual y plantillas.'
      checks:
      - tipo: xml_atributo
        parte: document
        contexto: cuerpo
        xpath: //w:body//w:p[w:r]/w:r[1]/w:rPr/w:sz
        atributo: '@w:val'
        comparacion: all_eq
        esperado: '24'
  - id: caratula_universidad_tamano
    tipo: fuente
    descripcion: Tamaño de letra del nombre de la Universidad en carátula
    valor_esperado: "18pt"
    severidad: error
    fuente: "MANUAL REVISADO TERCERA VERSION OBSERVACIONES 11-07-2025.docx"
    ubicacion: 'Carátula, especificaciones (párr. 174); nota indicativa en párr. 153: "(Times New Román 18 puntos/13 puntos/13 puntos)"'
