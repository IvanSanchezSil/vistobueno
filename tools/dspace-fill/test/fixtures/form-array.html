<!DOCTYPE html>
<!-- Fixture con la estructura REAL de los campos repetibles de DSpace
     8.1 (evidencia: captura de "Editar envío"): cada campo repetible
     vive en un contenedor #N_array con su lista de filas (cdk-drop-list)
     y su botón "ds-form-add-more".

     El render es ASÍNCRONO, como el de Angular: la fila aparece
     después del clic, no en el mismo tick (revisión PR #71, M4).

     El combobox de derechos se deja SIN opciones para probar el fallo
     visible (el caso "el listbox no coopera → el operador selecciona a
     mano"). -->
<html>
<body>
	<form id="editSubmissionForm">
		<div id="10_array" class="ng-untouched ng-pristine ng-valid">
			<div class="cdk-drop-list">
				<div class="cdk-drag form-row">
					<input type="text" name="dc.title" id="10_array-0-dc_title">
				</div>
			</div>
		</div>

		<div id="11_array" class="ng-untouched ng-pristine ng-invalid">
			<div class="cdk-drop-list">
				<div class="cdk-drag form-row">
					<input type="text" name="dc.contributor.author" id="11_array-0-dc_contributor_author">
					<div><button type="button" class="ds-form-add-more">+ Añadir</button></div>
				</div>
			</div>
		</div>

		<div id="15_array" class="ng-untouched ng-pristine ng-invalid">
			<div class="cdk-drop-list">
				<div class="cdk-drag form-row">
					<input type="text" name="dc.contributor.advisor" id="15_array-0-dc_contributor_advisor">
				</div>
			</div>
		</div>

		<div id="37_array" class="ng-untouched ng-pristine ng-invalid">
			<div class="cdk-drop-list">
				<div class="cdk-drag form-row">
					<textarea name="dc.description.abstract" id="37_array-0-dc_description_abstract"></textarea>
				</div>
			</div>
		</div>

		<div id="43_array" class="ng-untouched ng-pristine ng-invalid">
			<div class="cdk-drop-list">
				<div class="cdk-drag form-row">
					<input type="text" name="dc.subject" id="43_array-0-dc_subject">
					<div><button type="button" class="ds-form-add-more">+ Añadir</button></div>
				</div>
			</div>
		</div>

		<div id="13_array" class="ng-untouched ng-pristine ng-valid">
			<div class="cdk-drop-list">
				<div class="cdk-drag form-row">
					<select name="renati.author_QUALDROP_METADATA" id="13_array-0-renati_author_QUALDROP_METADATA">
						<option value=""></option>
						<option value="0: renati.author.dni">DNI</option>
						<option value="1: renati.author.cext">CE-Carné de extranjería</option>
						<option value="2: renati.author.pasaporte">Pasaporte</option>
						<option value="3: renati.author.cedula">Cédula de identidad</option>
					</select>
					<input type="text" name="renati.author_QUALDROP_VALUE" id="13_array-0-renati_author_QUALDROP_VALUE">
					<div><button type="button" class="ds-form-add-more">+ Añadir</button></div>
				</div>
			</div>
		</div>

		<div id="17_array" class="ng-untouched ng-pristine ng-valid">
			<div class="cdk-drop-list">
				<div class="cdk-drag form-row">
					<select name="renati.advisor_QUALDROP_METADATA" id="17_array-0-renati_advisor_QUALDROP_METADATA">
						<option value=""></option>
						<option value="0: renati.advisor.dni">DNI</option>
						<option value="1: renati.advisor.cext">CE-Carné de extranjería</option>
					</select>
					<input type="text" name="renati.advisor_QUALDROP_VALUE" id="17_array-0-renati_advisor_QUALDROP_VALUE">
				</div>
			</div>
		</div>

		<div id="19_array" class="ng-untouched ng-pristine ng-valid">
			<div class="cdk-drop-list">
				<div class="cdk-drag form-row">
					<input type="text" name="renati.advisor.orcid" id="19_array-0-renati_advisor_orcid">
				</div>
			</div>
		</div>

		<input type="text" id="dc_date_issued_year" maxlength="4" placeholder="Año">

		<!-- Combobox de nivel de acceso (bug dc.rights): input + listbox vacío -->
		<input type="text" id="dc_rights" name="dc.rights">
		<ul id="combobox_dc_rights_listbox"></ul>

		<button type="button" id="deposit">Depositar</button>
	</form>

	<script>
		// "Angular" re-renderiza de forma asíncrona: la fila aparece
		// después del clic, no en el mismo tick.
		document.querySelectorAll('[id$="_array"]').forEach(function (array) {
			const lista = array.querySelector(".cdk-drop-list");
			const boton = array.querySelector("button.ds-form-add-more");
			if (!lista || !boton) return;
			boton.addEventListener("click", function () {
				const filas = lista.querySelectorAll(".cdk-drag.form-row");
				const indice = filas.length;
				const clon = filas[filas.length - 1].cloneNode(true);
				clon.querySelectorAll("[id]").forEach(function (el) {
					el.id = el.id.replace(/-\d+-/, "-" + indice + "-");
				});
				const botonClon = clon.querySelector("button.ds-form-add-more");
				if (botonClon) botonClon.remove();
				clon.querySelectorAll("input,select,textarea").forEach(function (el) {
					if (el.type !== "button") el.value = "";
				});
				setTimeout(function () {
					lista.appendChild(clon);
				}, 50);
			});
		});
	</script>
</body>
</html>
