<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<title>Ítem archivado (MOCK)</title>
	<!-- El título y los autores del ítem se publican como metas de cita,
	     como hace el componente real de DSpace 8.1. El mock los toma de
	     la ficha vigente del buzón: el ítem archivado lleva los datos
	     que se depositaron, no un texto fijo. -->
</head>
<body>
	<h1>Ítem archivado (MOCK)</h1>
	<p>Simulación de la página del ítem tras aprobarse el envío.</p>
	<p id="titulo-item">(cargando el título del ítem…)</p>

	<!-- El handle va en la fila de metadatos "Handle" (como en el
	     componente real): si la página tuviera varios enlaces hdl, el
	     userscript elige el de esa fila y no el primero que aparece. -->
	<table>
		<tbody>
			<tr>
				<th scope="row">Handle</th>
				<td>
					<a id="handle-item" href="https://hdl.handle.net/20.500.14414/99999">https://hdl.handle.net/20.500.14414/99999</a>
				</td>
			</tr>
		</tbody>
	</table>

	<!-- Indicador PERSISTENTE (hallazgo 1): el toast del userscript dura
	     6 segundos; esto queda fijo para el operador que llega tarde. -->
	<div id="estado-reporte" style="background:#f0f4f8;border:1px solid #c0d0e0;border-radius:8px;padding:12px 16px;margin-top:16px">
		<strong>Estado del depósito:</strong>
		<span id="estado-reporte-texto" style="color:#555">Consultando…</span>
	</div>

	<!-- El userscript detecta la página del ítem y muestra el panel de
	     confirmación: el operador decide si el archivo quedó archivado. -->
	<script src="/shim-gm.js"></script>
	<script src="/userscript.js"></script>
	<script>
		// El título y los autores del ítem se publican como metas de
		// cita, como en DSpace. El mock los toma de la ficha vigente del
		// buzón para que el panel pueda compararlos.
		(async () => {
			try {
				const r = await fetch("/api-proxy/ficha-pendiente");
				if (r.status !== 200) return;
				const sobre = await r.json();
				const ficha = sobre.ficha || {};
				const extraidos = ficha.extraidos || [];
				const titulo = extraidos.find(function (e) {
					return e.campo === "dc.title";
				});
				const autores = extraidos.find(function (e) {
					return e.campo === "dc.contributor.author";
				});
				if (titulo && titulo.valor) {
					const meta = document.createElement("meta");
					meta.setAttribute("name", "citation_title");
					meta.setAttribute("content", String(titulo.valor));
					document.head.appendChild(meta);
					document.getElementById("titulo-item").textContent = String(titulo.valor);
				}
				const lista = autores && Array.isArray(autores.valor) ? autores.valor : [];
				for (const autor of lista) {
					const meta = document.createElement("meta");
					meta.setAttribute("name", "citation_author");
					meta.setAttribute("content", String(autor));
					document.head.appendChild(meta);
				}
			} catch (e) {
				// Sin metadatos publicados: el panel no aparece (fail-closed).
			}
		})();

		// Indicador persistente con reintentos: el depósito aparece
		// SOLO cuando el operador confirma en el panel del userscript.
		(async () => {
			const el = document.getElementById("estado-reporte-texto");
			const maximos = 8;
			for (let i = 0; i < maximos; i++) {
				await new Promise((r) => setTimeout(r, 2000));
				try {
					const r = await fetch("/api-proxy/deposito");
					if (r.status === 200) {
						const d = await r.json();
						el.textContent =
							"✅ Depósito confirmado por el operador — handle: " +
							d.handle +
							" · hora del clic en Depositar: " +
							d.timestamp +
							" · título observado: " +
							(d.titulo_observado || "?");
						return;
					}
					if (r.status === 404 && i < maximos - 1) {
						el.textContent =
							"Esperando la confirmación del operador… (intento " +
							(i + 1) +
							"/" +
							maximos +
							")";
						continue;
					}
					el.textContent = r.status === 404
						? "Sin depósito confirmado tras " + maximos + " intentos — confirma el archivo en el panel del userscript."
						: "El buzón respondió HTTP " + r.status + ".";
					return;
				} catch (e) {
					el.textContent = "No se pudo consultar el buzón (¿está la API en :8000?).";
					return;
				}
			}
		})();
	</script>
</body>
</html>
