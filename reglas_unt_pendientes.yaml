# ============================================================
# ESTRUCTURAS PENDIENTES — Fase B, paso 8 del PLAN_TIPO_DOCUMENTO
# ------------------------------------------------------------
# Las 5 estructuras que el manual define y el motor aun no cubre: proyecto
# (cuantitativo/cualitativo), informe (cuantitativo/cualitativo) y trabajo de
# suficiencia profesional.
#
# ESTE ARCHIVO NO LO CARGA LA API. Vive aparte a proposito: estas reglas estan
# implementadas pero NO probadas contra documentos reales, porque la facultad
# no tiene plantillas oficiales de estos 5 tipos (a diferencia de la TINV, que si
# las tiene). Meterlas en `reglas_unt.yaml` haria que la suite midiera un
# comportamiento que nadie verificó. Para usarlas hace falta una plantilla real
# de cada tipo.
#
# Lo que SI se verifica (test_tipo_documento.TestYamlPendienteOpcional) es la
# CONFIGURACION: que el archivo carga y pasa el linter del DSL. Eso detecta
# reglas mal formadas, `aplicar_si` apuntando a una clave que nadie expone, y
# estados duplicados o vacios. No dice nada sobre si el motor acierta.
#
# `deteccion_tipo_documento` se copia de `reglas_unt.yaml` porque el linter
# resuelve `aplicar_si` contra las claves expuestas del MISMO archivo: sin la
# copia, estas 5 reglas apuntarian a una clave inexistente. Al editar las
# etiquetas en produccion, replicar el cambio aqui.
#
# Convenciones de lectura, para poder cotejarlas contra el manual:
# - `original` es el texto tal cual lo lista el manual.
# - `patron` es solo el nombre del apartado, en mayusculas y sin la
#   numeracion ("1.4. Tipo de investigacion" -> "TIPO DE INVESTIGACION").
#   Asi el reconocimiento no depende de si el autor numera los titulos.
# - `opcional: true` significa que el motor NO lo exige (asi funciona en el
#   resto del DSL: los opcionales se omiten al construir el DFA).
# - Los esquemas empiezan en Caratula y terminan en ANEXOS. "Cubierta" no se
#   incluye porque es la hoja fisica anterior a la caratula, no una seccion.
# Nota sobre las paginas preliminares del TSP (punto 4 del paso 8):
# El plan pedia registrar que el manual exige "3.3 Aspectos generales" para el
# TSP y que eso lo cubria la regla `indice_hojas_preliminares`. Al cotejarlo
# contra el manual, ninguna de las dos premisas se sostiene:
# - "Aspectos generales" no aparece en el esquema del TSP (párr. 3628-3667).
#   En todo el manual solo sale en los parrafos 99, 1347, 1409, 1588, 2023 y
#   2100, ninguno de ellos del TSP.
# - La regla `indice_hojas_preliminares` no existe en el repositorio.
# - El "3.3" que menciona el plan es el criterio 3.3 de la LISTA DE COTEJO
#   (párr. 3744-3745) y habla de la justificacion, no de las paginas
#   preliminares.
# Lo que el manual si exige para el TSP es la numeracion de sus paginas
# preliminares en romanos minuscula, con la caratula contada pero no enumerada
# (párr. 3446-3447). Es el mismo texto que el requisito general de la pagina
# 139, y ya lo cubren tres reglas de produccion: `numeracion_preliminares_romano`
# (que cita la pagina 139), `numeracion_cuerpo_arabigo` y `caratula_no_se_enumera`.
# No hace falta una regla nueva, asi que aqui no se anade ninguna.
#
# - No se enumeran los anexos individuales: el manual los lista, pero su
#   presencia y numero dependen del tipo de estudio, asi que no son exigibles
#   desde el esquema. Los anexos obligatorios ya los cubren otras reglas.
# ============================================================

version: "2026-09-29"
namespaces:
  w: http://schemas.openxmlformats.org/wordprocessingml/2006/main
  r: http://schemas.openxmlformats.org/officeDocument/2006/relationships
  a: http://schemas.openxmlformats.org/drawingml/2006/main
  pic: http://schemas.openxmlformats.org/drawingml/2006/picture
reglas:
# Copia de la regla discriminadora de `reglas_unt.yaml` (mismo criterio y mismo
# orden de especificidad). Unica diferencia: los dos alias del punto 3 del
# paso 8, que se explican donde estan declarados.
- id: deteccion_tipo_documento
  tipo: deteccion
  descripcion: Determina a qué tipo de documento pertenece la tesis
  valor_esperado: >-
    uno de: tinv_cuantitativo, tinv_cualitativo, tinv_revision_literatura,
    proyecto_cuantitativo, proyecto_cualitativo, informe_cuantitativo,
    informe_cualitativo, tsp
  severidad: warning
  ubicacion: 'Capítulo II — esquemas formales por tipo de título (párr. 75-90)'
  fuente: MANUAL REVISADO TERCERA VERSION OBSERVACIONES 11-07-2025.docx
  cita: 'Cada título profesional exige un esquema formal distinto'
  deteccion_tipo:
    expone: tipo_documento
    declaracion:
      anexo: 'Anexo 10 — Declaración jurada (párr. 5008-5022)'
      etiquetas:
        tsp: ['TRABAJO DE SUFICIENCIA PROFESIONAL', 'TRABAJO DE SERVICIO', 'SERVICIO SOCIAL']
        # Punto 3 del paso 8: el Anexo 10 no tiene casillas propias para el
        # informe, solo el encabezado "INFORME DEL PROYECTO" (párr. 5018). Por
        # eso se admite tambien el nombre de la tesis, que es como lo
        # escriben algunos autores al llenar el formulario. No colisiona con
        # la TINV: sus etiquetas son "TESIS PARA OBTENER EL TITULO PROFESIONAL
        # EN INVESTIGACION ..." y "TRABAJO DE INVESTIGACION ...", y ninguna
        # contiene esta cadena.
        informe_cuantitativo: ['INFORME DE PROYECTO DE INVESTIGACIÓN CUANTITATIVA', 'TESIS DE INVESTIGACIÓN CUANTITATIVA']
        informe_cualitativo: ['INFORME DE PROYECTO DE INVESTIGACIÓN CUALITATIVA', 'TESIS DE INVESTIGACIÓN CUALITATIVA']
        proyecto_cuantitativo: ['PROYECTO DE INVESTIGACIÓN CUANTITATIVO']
        proyecto_cualitativo: ['PROYECTO DE INVESTIGACIÓN CUALITATIVO']
        tinv_revision_literatura: ['TESIS PARA OBTENER EL GRADO DE BACHILLER EN INVESTIGACIÓN']
        tinv_cualitativo: ['TESIS PARA OBTENER EL TÍTULO PROFESIONAL EN INVESTIGACIÓN CUALITATIVA']
        tinv_cuantitativo: ['TESIS PARA OBTENER EL TÍTULO PROFESIONAL EN INVESTIGACIÓN CUANTITATIVA']
    # En orden de especificidad: gana el primero que alcance su minimo.
    firmas:
    - tipo: tsp
      evidencia: ['SECUENCIA DIDÁCTICA', 'SUSTENTO PSICOPEDAGÓGICO', 'SUSTENTO TEÓRICO CIENTÍFICO']
      minimo: 2
    - tipo: informe_cualitativo
      evidencia: ['SITUACIÓN PROBLEMATIZADA', 'PARTICIPANTES', 'INSTRUMENTOS USADOS EN LA RECOLECCIÓN']
      minimo: 3
    - tipo: informe_cuantitativo
      evidencia: ['SITUACIÓN PROBLEMATIZADA', 'DISEÑO DE CONTRASTACIÓN', 'OPERACIONALIZACIÓN DE LAS VARIABLES']
      minimo: 2
    - tipo: proyecto_cuantitativo
      evidencia: ['PLAN DE INVESTIGACIÓN', 'RECURSOS Y MATERIALES', 'LÍNEA DE INVESTIGACIÓN']
      minimo: 2
    - tipo: proyecto_cualitativo
      evidencia: ['SELECCIÓN DE PARTICIPANTES', 'ESCENARIO', 'UNIDAD DE ANÁLISIS']
      minimo: 2
    - tipo: tinv_revision_literatura
      evidencia: ['METODOLOGÍA DE REVISIÓN', 'DESARROLLO O ANÁLISIS CRÍTICO DE LA LITERATURA', 'ESTADO DEL ARTE']
      minimo: 2
    - tipo: tinv_cualitativo
      evidencia: ['MATRIZ DE CATEGORIZACIÓN', 'ESTRATEGIAS USADAS EN EL ANÁLISIS', 'ANÁLISIS Y DISCUSIÓN DE RESULTADOS']
      minimo: 2
    - tipo: tinv_cuantitativo
      evidencia: ['VARIABLE', 'POBLACIÓN Y MUESTRA', 'INSTRUMENTO']
      minimo: 2
    minimo_global: 1

