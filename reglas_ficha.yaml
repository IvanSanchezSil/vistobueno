# Reglas de CAPTURA de la ficha de depósito (diseño 17).
#
# Estas reglas NO validan: su único fin es publicar el texto completo de un
# dato del DOCX para pre-llenar el formulario oficial de DSpace. Todas usan la
# sección `extraccion` sobre `AnalizadorExtraccion` (siempre `passed=True`,
# nunca tocan el semáforo). `build_report` las reúne en `reporte["ficha"]`
# como `dict[campo] = {"valor", "pagina", "detectado"}` (contrato de
# `docs/HANDOVER_MOTOR_FICHA_DEPOSITO.md` §4).
#
# Claves que publica el motor (PLAN_FICHA §4.2 + decisión 2026-11-23):
# dc.title, dc.contributor.author, dc.contributor.advisor,
# dc.description.abstract, dc.subject, dc.date.issued, escuela y
# renati.advisor.orcid. `renati.juror` sigue sin capturarse (viabilidad
# negativa del diseño 17) y la API lo publica como no detectado.
#
# No están en `reglas_unt.yaml` a propósito: allí cada regla debe tener una
# mutación (tests/_mutations.py) y una captura read-only no tiene desvío
# mínimo con sentido. La API las carga con `load_ficha_rules()` y las pasa a
# `validate_docx(..., ficha_data=...)`.

reglas:

- id: ficha_titulo
  tipo: estructura
  descripcion: Captura del título del trabajo (dc.title)
  valor_esperado: texto del título en carátula
  severidad: warning
  fuente: MANUAL REVISADO TERCERA VERSION OBSERVACIONES 11-07-2025.docx
  ubicacion: Carátula, Título del Trabajo de Investigación (párr. 177)
  cita: '"Título del Trabajo de Investigación"'
  extraccion:
    parte: document
    contexto: caratula
    campo: dc.title
    modo: texto
    # Cubre «Título del trabajo:» de las plantillas oficiales y la variante
    # «Título del trabajo de investigación:» de la tesis real (seguimiento #75).
    quitar_prefijo: ^T[íi]tulo del trabajo(?:\s+de\s+investigaci[óo]n)?\s*:?\s*
    xpath: //w:body/w:p[contains(translate(normalize-space(.), 'ABCDEFGHIJKLMNOPQRSTUVWXYZÁÉÍÓÚÑÜáéíóúñü', 'abcdefghijklmnopqrstuvwxyzaeiounuaeiounu'), 'para optar')][1]/preceding-sibling::w:p[normalize-space(.)][not(contains(translate(normalize-space(.), 'ABCDEFGHIJKLMNOPQRSTUVWXYZÁÉÍÓÚÑÜáéíóúñü', 'abcdefghijklmnopqrstuvwxyzaeiounuaeiounu'), 'universidad'))][not(contains(translate(normalize-space(.), 'ABCDEFGHIJKLMNOPQRSTUVWXYZÁÉÍÓÚÑÜáéíóúñü', 'abcdefghijklmnopqrstuvwxyzaeiounuaeiounu'), 'facultad'))][not(contains(translate(normalize-space(.), 'ABCDEFGHIJKLMNOPQRSTUVWXYZÁÉÍÓÚÑÜáéíóúñü', 'abcdefghijklmnopqrstuvwxyzaeiounuaeiounu'), 'escuela'))][not(contains(translate(normalize-space(.), 'ABCDEFGHIJKLMNOPQRSTUVWXYZÁÉÍÓÚÑÜáéíóúñü', 'abcdefghijklmnopqrstuvwxyzaeiounuaeiounu'), 'programa'))][not(contains(translate(normalize-space(.), 'ABCDEFGHIJKLMNOPQRSTUVWXYZÁÉÍÓÚÑÜáéíóúñü', 'abcdefghijklmnopqrstuvwxyzaeiounuaeiounu'), 'tesis') and string-length(normalize-space(.)) < 40)][1]

- id: ficha_autores
  tipo: estructura
  descripcion: Captura de los autores (dc.contributor.author)
  valor_esperado: lista de nombres de autor(es)
  severidad: warning
  fuente: MANUAL REVISADO TERCERA VERSION OBSERVACIONES 11-07-2025.docx
  ubicacion: Carátula, Apellidos y Nombres del autor (párr. 179)
  cita: '"Apellidos y Nombres del autor(a/es/as)"'
  extraccion:
    parte: document
    contexto: caratula
    campo: dc.contributor.author
    modo: lista
    etiqueta: autores
    # La etiqueta literal no cubre «AUTORA:» ni «AUTOR(A):»; el prefijo sí
    # (AUD-24 y seguimiento del PR #75 sobre las plantillas oficiales).
    quitar_prefijo: ^\s*autor\s*(?:\([^)]*\)|as?|es)?\s*:?\s*
    # AUD-24: todos los párrafos de autor tras «AUTORES:»/«AUTORA:», sin
    # partir por la coma interna de «Apellidos, Nombres». Se saltan las
    # instrucciones entre paréntesis de las plantillas y se corta en
    # «ASESOR(A):» o «Línea de investigación:». Desde 2026-11-23 las líneas
    # de ORCID puras se descartan con `filtro` (no con el XPath) para que un
    # autor con su ORCID en el mismo párrafo no desaparezca; el sufijo se
    # recorta con `quitar_sufijo`, con o sin la etiqueta «(Código) ORCID:».
    # El 2026-11-24 (revisión del PR #124) el corte en «ASESOR(A):» o
    # «Línea de investigación:» se acota a los párrafos que tienen un
    # «AUTORES:» precedente: una línea anterior a la etiqueta no debe borrar
    # a todos los autores.
    filtro: '^(?!\s*\(?\s*(?:(?:c[oó]digo\s+)?orcid\s*:\s*)?(?:https?://(?:www\.)?orcid\.org/)?\d{4}-?\d{4}-?\d{4}-?\d{3}[\dXx]\s*\)?\s*\.?\s*$).*'
    quitar_sufijo: '\s*\(?\s*(?:(?:c[oó]digo\s+)?orcid\s*:\s*)?(?:https?://(?:www\.)?orcid\.org/)?\d{4}-?\d{4}-?\d{4}-?\d{3}[\dXx]\s*\)?\s*$'
    xpath: //w:body/w:p[starts-with(translate(normalize-space(.), 'ABCDEFGHIJKLMNOPQRSTUVWXYZÁÉÍÓÚÑÜáéíóúñü', 'abcdefghijklmnopqrstuvwxyzaeiounuaeiounu'), 'autor')][1] | //w:body/w:p[starts-with(translate(normalize-space(.), 'ABCDEFGHIJKLMNOPQRSTUVWXYZÁÉÍÓÚÑÜáéíóúñü', 'abcdefghijklmnopqrstuvwxyzaeiounuaeiounu'), 'autor')][1]/following-sibling::w:p[not(starts-with(translate(normalize-space(.), 'ABCDEFGHIJKLMNOPQRSTUVWXYZÁÉÍÓÚÑÜáéíóúñü', 'abcdefghijklmnopqrstuvwxyzaeiounuaeiounu'), 'asesor')) and not(starts-with(translate(normalize-space(.), 'ABCDEFGHIJKLMNOPQRSTUVWXYZÁÉÍÓÚÑÜáéíóúñü', 'abcdefghijklmnopqrstuvwxyzaeiounuaeiounu'), 'linea')) and not(starts-with(translate(normalize-space(.), 'ABCDEFGHIJKLMNOPQRSTUVWXYZÁÉÍÓÚÑÜáéíóúñü', 'abcdefghijklmnopqrstuvwxyzaeiounuaeiounu'), 'orcid')) and not(starts-with(translate(normalize-space(.), 'ABCDEFGHIJKLMNOPQRSTUVWXYZÁÉÍÓÚÑÜáéíóúñü', 'abcdefghijklmnopqrstuvwxyzaeiounuaeiounu'), '(')) and not(w:pPr/w:pStyle) and not(preceding-sibling::w:p[starts-with(translate(normalize-space(.), 'ABCDEFGHIJKLMNOPQRSTUVWXYZÁÉÍÓÚÑÜáéíóúñü', 'abcdefghijklmnopqrstuvwxyzaeiounuaeiounu'), 'asesor') or starts-with(translate(normalize-space(.), 'ABCDEFGHIJKLMNOPQRSTUVWXYZÁÉÍÓÚÑÜáéíóúñü', 'abcdefghijklmnopqrstuvwxyzaeiounuaeiounu'), 'linea')][preceding-sibling::w:p[starts-with(translate(normalize-space(.), 'ABCDEFGHIJKLMNOPQRSTUVWXYZÁÉÍÓÚÑÜáéíóúñü', 'abcdefghijklmnopqrstuvwxyzaeiounuaeiounu'), 'autor')]]) and not(preceding-sibling::w:p[w:pPr/w:pStyle])]

- id: ficha_asesor
  tipo: estructura
  descripcion: Captura del asesor (dc.contributor.advisor)
  valor_esperado: nombre del asesor
  severidad: warning
  fuente: MANUAL REVISADO TERCERA VERSION OBSERVACIONES 11-07-2025.docx
  ubicacion: Carátula, Apellidos y nombres del asesor (párr. 180)
  cita: '"Apellidos y nombres del/a asesor(a)"'
  extraccion:
    parte: document
    contexto: caratula
    campo: dc.contributor.advisor
    modo: texto
    quitar_prefijo: ^\s*asesor\(a\)\s*:?\s*|^\s*asesor(?:a)?\s*:?\s*
    # AUD-25: la etiqueta «ASESOR(A):» suele ir en su propio párrafo y el
    # nombre en el siguiente; si van juntos, la propia etiqueta trae el
    # nombre. `primero_no_vacio` elige la primera pieza que, tras limpiar el
    # prefijo, no quede vacía. Desde 2026-11-23 se descarta la línea de ORCID
    # pura (antes se publicaba como nombre) y se recorta el ORCID pegado al
    # final del nombre, con o sin la etiqueta «(Código) ORCID:». La etiqueta
    # se localiza con `starts-with`: `contains` podía tomar como etiqueta un
    # título que mencionara «asesoría». El XPath se corta en «Línea de
    # investigación:» para que, si solo hay ORCID, no se publique esa etiqueta
    # (ni el texto posterior) como nombre del asesor. El 2026-11-24 (revisión
    # del PR #124) ese corte se acota a una línea que tenga un párrafo
    # «ASESOR(A):» precedente: una línea anterior al bloque no debe dejar el
    # asesor sin detectar.
    filtro: '^(?!\s*\(?\s*(?:(?:c[oó]digo\s+)?orcid\s*:\s*)?(?:https?://(?:www\.)?orcid\.org/)?\d{4}-?\d{4}-?\d{4}-?\d{3}[\dXx]\s*\)?\s*\.?\s*$).*'
    quitar_sufijo: '\s*\(?\s*(?:(?:c[oó]digo\s+)?orcid\s*:\s*)?(?:https?://(?:www\.)?orcid\.org/)?\d{4}-?\d{4}-?\d{4}-?\d{3}[\dXx]\s*\)?\s*$'
    seleccion: primero_no_vacio
    xpath: //w:body/w:p[starts-with(translate(normalize-space(.), 'ABCDEFGHIJKLMNOPQRSTUVWXYZÁÉÍÓÚÑÜáéíóúñü', 'abcdefghijklmnopqrstuvwxyzaeiounuaeiounu'), 'asesor')][1] | //w:body/w:p[starts-with(translate(normalize-space(.), 'ABCDEFGHIJKLMNOPQRSTUVWXYZÁÉÍÓÚÑÜáéíóúñü', 'abcdefghijklmnopqrstuvwxyzaeiounuaeiounu'), 'asesor')][1]/following-sibling::w:p[normalize-space(.)][not(starts-with(translate(normalize-space(.), 'ABCDEFGHIJKLMNOPQRSTUVWXYZÁÉÍÓÚÑÜáéíóúñü', 'abcdefghijklmnopqrstuvwxyzaeiounuaeiounu'), 'linea'))][not(preceding-sibling::w:p[starts-with(translate(normalize-space(.), 'ABCDEFGHIJKLMNOPQRSTUVWXYZÁÉÍÓÚÑÜáéíóúñü', 'abcdefghijklmnopqrstuvwxyzaeiounuaeiounu'), 'linea')][preceding-sibling::w:p[starts-with(translate(normalize-space(.), 'ABCDEFGHIJKLMNOPQRSTUVWXYZÁÉÍÓÚÑÜáéíóúñü', 'abcdefghijklmnopqrstuvwxyzaeiounuaeiounu'), 'asesor')]])][position() <= 2]

- id: ficha_orcid_asesor
  tipo: estructura
  descripcion: Captura del ORCID del asesor (renati.advisor.orcid)
  valor_esperado: identificador ORCID del asesor
  severidad: warning
  fuente: MANUAL REVISADO TERCERA VERSION OBSERVACIONES 11-07-2025.docx
  ubicacion: Carátula, Apellidos y nombres del asesor (párr. 180)
  cita: '"Apellidos y nombres del/a asesor(a)"'
  extraccion:
    parte: document
    contexto: caratula
    campo: renati.advisor.orcid
    modo: texto
    filtro: '(?<![\dXx])\d{4}-?\d{4}-?\d{4}-?\d{3}[\dXx](?![\dXx])'
    patron: '((?<![\dXx])\d{4}-?\d{4}-?\d{4}-?\d{3}[\dXx](?![\dXx]))'
    seleccion: primero
    xpath: //w:body/w:p[starts-with(translate(normalize-space(.), 'ABCDEFGHIJKLMNOPQRSTUVWXYZÁÉÍÓÚÑÜáéíóúñü', 'abcdefghijklmnopqrstuvwxyzaeiounuaeiounu'), 'asesor')][1] | //w:body/w:p[starts-with(translate(normalize-space(.), 'ABCDEFGHIJKLMNOPQRSTUVWXYZÁÉÍÓÚÑÜáéíóúñü', 'abcdefghijklmnopqrstuvwxyzaeiounuaeiounu'), 'asesor')][1]/following-sibling::w:p[normalize-space(.)][position() <= 2]

- id: ficha_escuela
  tipo: estructura
  descripcion: Captura de la escuela profesional (columna ESCUELAS del registro)
  valor_esperado: nombre de la escuela profesional
  severidad: warning
  fuente: MANUAL REVISADO TERCERA VERSION OBSERVACIONES 11-07-2025.docx
  ubicacion: Carátula, Facultad y Escuela Profesional (párr. 175)
  cita: '"Facultad y Escuela Profesional"'
  extraccion:
    parte: document
    contexto: caratula
    campo: escuela
    modo: texto
    xpath: //w:body/w:p[contains(translate(normalize-space(.), 'ABCDEFGHIJKLMNOPQRSTUVWXYZÁÉÍÓÚÑÜáéíóúñü', 'abcdefghijklmnopqrstuvwxyzaeiounuaeiounu'), 'escuela') or contains(translate(normalize-space(.), 'ABCDEFGHIJKLMNOPQRSTUVWXYZÁÉÍÓÚÑÜáéíóúñü', 'abcdefghijklmnopqrstuvwxyzaeiounuaeiounu'), 'programa')][1]

- id: ficha_anio
  tipo: estructura
  descripcion: Captura del año de emisión (dc.date.issued)
  valor_esperado: año de la carátula
  severidad: warning
  fuente: MANUAL REVISADO TERCERA VERSION OBSERVACIONES 11-07-2025.docx
  ubicacion: Carátula, Ciudad y año (párr. 182)
  cita: '"Ciudad y país"'
  # AUD-26: el título puede terminar en ", Trujillo 2024" y el año de
  # portada (2026) vive en otro párrafo, a veces el que porta el `sectPr`.
  # El filtro exige una línea de portada: el año suelto o con la ciudad
  # delante («Trujillo - Perú, 2026»), nunca una frase larga como el título
  # ni una referencia. Entre las que quedan se toma la última.
  extraccion:
    parte: document
    contexto: caratula_ficha
    campo: dc.date.issued
    modo: texto
    filtro: ^\s*(?:\S+\s+){0,4}(?:19|20)\d{2}\s*[.]?\s*$
    seleccion: ultimo
    patron: \b(?:19|20)\d{2}\b
    xpath: //w:body/w:p

- id: ficha_resumen
  tipo: estructura
  descripcion: Captura del resumen (dc.description.abstract)
  valor_esperado: texto completo del resumen
  severidad: warning
  fuente: MANUAL REVISADO TERCERA VERSION OBSERVACIONES 11-07-2025.docx
  ubicacion: Sección Resumen (párr. 201)
  cita: '"Resumen"'
  extraccion:
    campo: dc.description.abstract
    modo: texto
    unir: true
    filtro: ^(?!\s*palabras\s+clave)
    seccion:
      inicio: ^\s*resumen\s*$

- id: ficha_palabras_clave
  tipo: estructura
  descripcion: Captura de las palabras clave (dc.subject)
  valor_esperado: lista de palabras clave
  severidad: warning
  fuente: MANUAL REVISADO TERCERA VERSION OBSERVACIONES 11-07-2025.docx
  ubicacion: Resumen, "Palabras clave" (párr. 201)
  cita: '"Palabras clave"'
  # La línea "Palabras clave: a, b, c" se parte por el separador tras la
  # etiqueta; el modo lista devuelve cada clave.
  extraccion:
    campo: dc.subject
    modo: lista
    etiqueta: palabras clave
    separador: \s*[,;]\s*
    filtro: ^\s*palabras\s+clave
    quitar_sufijo: \s*\.\s*$
    seccion:
      inicio: ^\s*resumen\s*$
